<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="#0b0f19" />
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" />
  
  <!-- Trending Up & Currency Symbols -->
  <g transform="translate(100, 100) scale(1.3)" filter="url(#shadow)">
    <!-- Rupee / Growth Symbol -->
    <path d="M40 70 L140 70 M40 100 L110 100 M40 70 C100 70 120 120 70 140 L130 200" 
          stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Dynamic growth arrow -->
    <path d="M120 60 L180 20 L210 50 M180 20 L110 90" 
          stroke="#22d3ee" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
